<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | Die Welt mit meinen Augen</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Suchleiste oben -->
    <header style="padding: 30px 20px; text-align: center;">
        <h1 style="font-family: 'Playfair Display', Georgia, serif; margin-bottom: 20px;">Galerien</h1>
        <form id="search-form" style="position: relative; display: inline-block; width: 100%; max-width: 400px;">
            <input type="text" id="search-input" placeholder="Nach Kategorien oder Orten suchen..." style="width: 100%; padding: 12px 20px; background: #222; border: 1px solid #444; border-radius: 25px; color: #fff; outline: none;">
            <button type="button" id="search-clear" class="hidden" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer;">✕</button>
        </form>
    </header>

    <!-- Loading View -->
    <div id="view-loading" style="text-align: center; padding: 50px; color: #777;">
        <p id="loading-label">Wird geladen …</p>
    </div>

    <!-- Error View -->
    <div id="view-error" class="hidden" style="text-align: center; padding: 50px; color: #ff6b6b;">
        <p id="error-label"></p>
        <button id="retry-btn" style="padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">Erneut versuchen</button>
    </div>

    <!-- Categories View -->
    <div id="view-categories">
        <nav id="breadcrumb-categories" style="padding: 10px 20px; color: #aaa;"></nav>
        <div style="padding: 20px;">
            <p id="categories-eyebrow" style="text-transform: uppercase; font-size: 0.8rem; color: #777; margin: 0;"></p>
            <h2 id="categories-title" style="font-size: 2rem; margin: 5px 0 20px 0;"></h2>
            <div id="category-grid" style="display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; padding-bottom: 50px;"></div>
        </div>
    </div>

    <!-- Category Detail View -->
    <div id="view-category-detail" class="hidden">
        <nav id="breadcrumb-detail" style="padding: 10px 20px; color: #aaa;"></nav>
        <div style="padding: 20px;">
            <button id="back-btn" style="background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem; margin-bottom: 15px;">← Zurück</button>
            <h2 id="detail-title" style="font-size: 2rem; margin: 5px 0 5px 0;"></h2>
            <p id="detail-count" style="color: #777; margin: 0 0 25px 0;"></p>
            <div id="thumb-grid" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding-bottom: 50px;"></div>
        </div>
    </div>

    <!-- Search View -->
    <div id="view-search" class="hidden">
        <div style="padding: 20px;">
            <p id="search-eyebrow" style="text-transform: uppercase; font-size: 0.8rem; color: #777; margin: 0;"></p>
            <h2 id="search-title" style="font-size: 2rem; margin: 5px 0 25px 0;"></h2>
            <div id="search-grid" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding-bottom: 50px;"></div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <button id="lightbox-close" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;">✕</button>
        <button id="lightbox-prev" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;">‹</button>
        <button id="lightbox-next" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;">›</button>
        
        <img id="lightbox-img" style="max-height: 75vh; max-width: 85vw; object-fit: contain;" alt="">
        <div style="margin-top: 15px; text-align: center; color: #ccc;">
            <p id="lightbox-caption" style="margin: 0 0 5px 0;"></p>
            <p id="lightbox-name-text" style="margin: 0; font-weight: bold;"></p>
            <div style="margin-top: 10px; display: flex; gap: 15px; justify-content: center;">
                <a id="lightbox-location-cell" class="hidden" href="#" target="_blank" style="color: #aaa; text-decoration: underline;"><span id="lightbox-location-text"></span></a>
                <span id="lightbox-note-cell" class="hidden"><span id="lightbox-note-text"></span></span>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button id="lightbox-download" style="padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Download</button>
                <button id="lightbox-share" style="padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Teilen</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 4px; border: 1px solid #444; z-index: 1100;"></div>

    <!-- Skriptbindung -->
    <script src="app.js"></script>
</body>
</html>
