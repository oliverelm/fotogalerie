<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Welt mit meinen Augen | Startseite</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
        }
        
        .hero-home {
            width: 100%; 
            height: 100vh;
            background-size: cover; 
            background-position: center;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center; 
            color: white; 
            text-align: center;
            position: relative;
        }

        .hero-home::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-home h1 { 
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: 4rem; 
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.9); 
            margin: 0 0 15px 0; 
        }

        .hero-home p { 
            font-family: "Lora", Georgia, serif;
            font-style: italic;
            font-size: 1.5rem; 
            letter-spacing: 1px;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.9); 
            margin: 0 0 40px 0;
            opacity: 0.95;
        }

        .btn-galerie {
            display: inline-block;
            padding: 16px 45px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .btn-galerie:hover {
            background-color: #fff;
            color: #111;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

<div id="hero" class="hero-home">
    <div class="hero-content">
        <h1>Die Welt mit meinen Augen</h1>
        <p>Ein Blick. Ein Moment. Eine Geschichte.</p>
        <a href="galerie.html" class="btn-galerie">Galerie</a>
    </div>
</div>

<script>
    const heroImages = [
        "hero-bruecke-hafen.jpg", "hero-bruecke-nacht-1.jpg", "hero-douro-tal.jpg", 
        "hero-london-nacht.jpg", "hero-london-tag.jpg", "hero-paris-grand-palais.jpg", 
        "hero-paris-seine.jpg", "hero-porto-abend.jpg", "hero-porto-nacht.jpg", "hero-sevilla.jpg"
    ];
    const randomImage = heroImages[Math.floor(Math.random() * heroImages.length)];
    document.getElementById('hero').style.backgroundImage = `url('${randomImage}')`;
</script>

</body>
</html>
