<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Welt mit meinen Augen | Startseite</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        
        /* Vollbild-Hero auf der Startseite */
        .hero-home {
            width: 100%; 
            height: 100vh;
            background-size: cover; 
            background-position: center;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center; 
            color: white; 
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hero-home::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-home h1 { 
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: 4rem; 
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.9); 
            margin: 0 0 15px 0; 
        }

        .hero-home p { 
            font-family: "Lora", Georgia, serif;
            font-style: italic;
            font-size: 1.5rem; 
            letter-spacing: 1px;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.9); 
            margin: 0 0 35px 0;
            opacity: 0.95;
        }

        /* Schöner Galerie-Button */
        .btn-galerie {
            display: inline-block;
            padding: 14px 38px;
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-galerie:hover {
            background-color: #fff;
            color: #111;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="hero" class="hero-home">
    <div class="hero-content">
        <h1>Die Welt mit meinen Augen</h1>
        <p>Ein Blick. Ein Moment. Eine Geschichte.</p>
        <a href="galerie.html" class="btn-galerie">Galerie</a>
    </div>
</div>

<script>
    // Zufälliges Hero-Bild beim Start
    const heroImages = [
        "hero-bruecke-hafen.jpg", "hero-bruecke-nacht-1.jpg", "hero-douro-tal.jpg", 
        "hero-london-nacht.jpg", "hero-london-tag.jpg", "hero-paris-grand-palais.jpg", 
        "hero-paris-seine.jpg", "hero-porto-abend.jpg", "hero-porto-nacht.jpg", "hero-sevilla.jpg"
    ];
    const randomImage = heroImages[Math.floor(Math.random() * heroImages.length)];
    document.getElementById('hero').style.backgroundImage = `url('${randomImage}')`;
</script>

</body>
</html>
