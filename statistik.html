<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Statistik</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #111111;
    --ink: #f2ede4;
    --ink-dim: #a39c92;
    --accent: #c9924f;
    --accent-bright: #e3b273;
    --line: #333029;
    --surface: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
  }
  .panel { width: 100%; max-width: 420px; }
  h1 {
    font-family: "Newsreader", serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0 0 28px;
  }
  .key-row { display: flex; gap: 8px; margin-bottom: 36px; }
  input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 10px 20px;
    border-radius: 2px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #14110b;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
  .stats { display: grid; gap: 14px; }
  .stat-card {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .stat-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .stat-value { font-family: "Newsreader", serif; font-size: 30px; }
  .error {
    color: #c1655a;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    margin: 16px 0 0;
    min-height: 16px;
  }
</style>
</head>
<body>

  <div class="panel">
    <h1>Statistik</h1>
    <div class="key-row">
      <input id="key-input" type="password" placeholder="Geheimer Schlüssel" autocomplete="off">
      <button id="load-btn">Anzeigen</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">Besuche</span>
        <span class="stat-value" id="stat-visits">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Angesehene Bilder</span>
        <span class="stat-value" id="stat-images">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Downloads</span>
        <span class="stat-value" id="stat-downloads">—</span>
      </div>
    </div>

    <p class="error" id="error-text"></p>
  </div>

  <script>
    const keyInput = document.getElementById("key-input");
    const loadBtn = document.getElementById("load-btn");
    const errorText = document.getElementById("error-text");

    const savedKey = localStorage.getItem("statsKey");
    if (savedKey) keyInput.value = savedKey;

    async function load() {
      const key = keyInput.value.trim();
      errorText.textContent = "";
      if (!key) return;

      try {
        const res = await fetch(`/api/admin-stats?key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Fehler beim Laden.");

        localStorage.setItem("statsKey", key);
        document.getElementById("stat-visits").textContent = data.visits.toLocaleString("de-DE");
        document.getElementById("stat-images").textContent = data.images.toLocaleString("de-DE");
        document.getElementById("stat-downloads").textContent = data.downloads.toLocaleString("de-DE");
      } catch (e) {
        errorText.textContent = e.message;
      }
    }

    loadBtn.addEventListener("click", load);
    keyInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") load();
    });

    if (savedKey) load();
  </script>
</body>
</html>
